name: dbt Nightly Build

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST / 10 PM PST)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Run dbt build with --full-refresh"
        required: false
        type: boolean
        default: false

jobs:
  dbt-build:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: dbt
    env:
      DB_HOST: ${{ secrets.DATABASE_HOST }}
      DB_USER: ${{ secrets.GLOBAL_DB_USER }}
      DB_PASS: ${{ secrets.GLOBAL_DB_PASS }}
      DB_NAME: ${{ vars.DATABASE_NAME }}
      DB_SSLMODE: require
      PGSSLMODE: require
      DB_SCHEMA: analytics
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        if: vars.BIGQUERY_ENABLED == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt dependencies
        run: pip install -r requirements.txt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps

      - name: Verify dbt connection
        run: dbt debug

      - name: Ensure analytics schema exists
        run: |
          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "CREATE SCHEMA IF NOT EXISTS analytics;"

      - name: Run dbt build
        run: |
          FLAGS="--target postgres"
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          dbt build $FLAGS

      # The GA4 event marts live in BigQuery; income, county and utility provider
      # live in Postgres. Metabase cannot join across databases in a native query,
      # so the bucketed household attributes are copied over here, between the two
      # dbt builds: after Postgres has rebuilt the bridge mart, and before the
      # BigQuery build whose models read it.
      #
      # Bands and flags only — no raw income, address or ZIP leaves Postgres. See
      # mart_screener_household_attributes for what is deliberately excluded.
      - name: Load the household-attribute bridge into BigQuery
        if: vars.BIGQUERY_ENABLED == 'true'
        run: |
          set -euo pipefail

          PGPASSWORD="$DB_PASS" psql \
            -h "$DB_HOST" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            --csv \
            -c "SELECT * FROM analytics.mart_screener_household_attributes;" \
            > household_attributes.csv

          ROWS=$(($(wc -l < household_attributes.csv) - 1))
          echo "Exported ${ROWS} row(s) from Postgres."

          # A truncating load of an empty export would wipe the segmentation for
          # every card, so fail loudly instead. An empty result means the upstream
          # mart did not build, not that there are no screenings.
          if [ "$ROWS" -le 0 ]; then
            echo "::error::Household-attribute export is empty — refusing to truncate the BigQuery copy"
            exit 1
          fi

          bq load \
            --project_id="${GCP_PROJECT_ID}" \
            --source_format=CSV \
            --skip_leading_rows=1 \
            --autodetect \
            --replace \
            "${GCP_PROJECT_ID}:analytics.screener_household_attributes" \
            household_attributes.csv

          echo "Loaded ${ROWS} row(s) into ${GCP_PROJECT_ID}:analytics.screener_household_attributes"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      - name: Run dbt build (BigQuery)
        if: vars.BIGQUERY_ENABLED == 'true'
        run: |
          FLAGS="--target bigquery"
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          dbt build $FLAGS
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ANALYTICS_TABLE: ${{ vars.GCP_ANALYTICS_TABLE }}

      - name: Trigger Metabase schema sync
        run: |
          METABASE_API="${METABASE_URL}/api"

          # Get session token
          SESSION=$(curl -sf -X POST "${METABASE_API}/session" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${METABASE_ADMIN_EMAIL}\", \"password\": \"${METABASE_ADMIN_PASSWORD}\"}" \
            | jq -r '.id')

          if [ -z "$SESSION" ] || [ "$SESSION" = "null" ]; then
            echo "::warning::Failed to authenticate with Metabase — skipping sync"
            exit 0
          fi

          # Get all database IDs and trigger sync on each
          DB_IDS=$(curl -s "${METABASE_API}/database" \
            -H "X-Metabase-Session: ${SESSION}" \
            | jq -r '.data[].id')

          if [ -z "$DB_IDS" ]; then
            echo "::warning::No databases found or failed to fetch database list — skipping sync"
            exit 0
          fi

          for DB_ID in $DB_IDS; do
            echo "Syncing database ${DB_ID}..."
            if ! curl -sf -X POST "${METABASE_API}/database/${DB_ID}/sync_schema" \
              -H "X-Metabase-Session: ${SESSION}"; then
              echo "::warning::Failed to sync database ${DB_ID}"
            fi
          done

          echo "Waiting 30s for Metabase to complete sync..."
          sleep 30
          echo "Sync triggered for all databases."
        env:
          METABASE_URL: ${{ vars.METABASE_URL }}
          METABASE_ADMIN_EMAIL: ${{ vars.METABASE_ADMIN_EMAIL }}
          METABASE_ADMIN_PASSWORD: ${{ secrets.METABASE_ADMIN_PASSWORD }}

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts-production
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
          retention-days: 7
