name: benefits_dbt
version: 1.0.0
profile: benefits
require-dbt-version: ">=1.7.0,<2.0.0"

on-run-start:
  - "{{ ensure_mfb_current_white_label_id_function() }}"
  - "{{ enforce_rls_on_marts() }}"

vars:
  # RLS on postgres marts: session_guc (app.white_label_id — index-friendly, MFB-975)
  # Previously regex_user (role name); switched to session_guc to enable index scans.
  mfb_rls_policy_mode: session_guc

  # White-label slugs that appear as the first path segment of a screener URL.
  # Used to parse state from page_location for chrome events that fire before the
  # screener_state param is set (see the url_screener_state macro). Keep in sync
  # with tenant_ga_state_codes in the dashboards Terraform when a WL launches.
  screener_state_slugs: ["co", "nc", "tx", "wa", "il", "ma", "cesn"]

  # First day all screener analytics events emit correctly (YYYYMMDD). Used to
  # prune the events_* wildcard scan in models that read the raw export directly.
  # Mirrors screener_analytics_epoch in the dashboards Terraform.
  screener_analytics_epoch_suffix: "20260729"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

seeds:
  benefits_dbt:
    # Only the Postgres household-attribute bridge reads this, so there is no
    # reason to materialize a copy in BigQuery on every nightly run.
    co_county_regions:
      +enabled: "{{ target.type == 'postgres' }}"
      +schema: internal
      +column_types:
        county_name: varchar(64)
        region: varchar(32)
        region_sort: integer

models:
  benefits_dbt:
    +materialized: view
    postgres:
      +enabled: "{{ target.type == 'postgres' }}"
      staging:
        +materialized: view
        +schema: internal
      intermediate:
        +materialized: view
        +schema: internal
      marts:
        +materialized: table
    bigquery:
      +enabled: "{{ target.type == 'bigquery' }}"
      staging:
        +materialized: view
        +schema: internal
      intermediate:
        +materialized: view
        +schema: internal
      marts:
        +materialized: table
