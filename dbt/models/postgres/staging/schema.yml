version: 2

models:
  - name: stg_current_benefits
    description: "One row per screen × benefit. Thin, direct representation of screener_current_benefits."
    columns:
      - name: screen_id
        description: "Foreign key to screener_screen — identifies the screener submission"
        tests:
          - not_null
      - name: program_id
        description: "Foreign key to programs_program — identifies the benefit program"
        tests:
          - not_null

  - name: stg_referrer_codes
    description: "Referrer codes with partner display names, sourced directly from the Django Referrer model. Partner names are stored inline — no separate mapping needed."
    columns:
      - name: referrer_code
        description: "The referrer code used to identify partners. Unique per white label, not globally."
      - name: partner
        description: "The display name of the partner, stored directly on the Referrer model."
        tests:
          - not_null
      - name: white_label_id
        description: "FK to screener_whitelabel. Every referrer belongs to exactly one white label."
        tests:
          - not_null
          - relationships:
              to: source('django_apps', 'screener_whitelabel')
              field: id
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - referrer_code
            - white_label_id

  - name: stg_white_label_programs
    description: "One row per white label × program name it sees: its own programs plus the federal ones. For a shared name the active row wins, then the federal one. Join on (white_label_id, name_abbreviated) to resolve a screen's program without fanning out."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - white_label_id
            - name_abbreviated
    columns:
      - name: white_label_id
        description: "The white label seeing the program (never the federal one itself)"
        tests:
          - not_null
      - name: name_abbreviated
        description: "Program slug, shared by a federal row and the state rows it replaced"
        tests:
          - not_null
      - name: program_id
        description: "programs_program row the white label resolves this name to"
        tests:
          - not_null
      - name: is_federal
        description: "Whether the resolved row belongs to the federal white label"
