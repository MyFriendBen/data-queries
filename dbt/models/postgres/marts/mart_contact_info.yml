version: 2

models:
  - name: mart_contact_info
    description: >
      Contact information for completed screeners whose user opted in to
      follow-up contact. Built for partner follow-up workflows (MFB-1198 /
      CPAL). Contains PII — cards built on this table must live in
      collections restricted to the relevant partner viewer group, and rows
      are limited to consenting users only. Protected by white-label RLS.
    columns:
      - name: screen_id
        description: "Primary key of the screen (screener_screen.id)"
        tests:
          - not_null
          - unique
      - name: white_label_id
        description: "White label ID used by the RLS policy"
        tests:
          - not_null
      - name: submission_timestamp
        description: "Full timestamp when the screener was completed"
      - name: referrer_code
        description: "Raw referrer code from the screener URL"
      - name: partner
        description: "Partner display name resolved from programs_referrer"
      - name: county
        description: "County reported on the screen ('Unspecified' when blank)"
      - name: email
        description: "User email (PII) — null when user signed up by phone"
      - name: phone
        description: "User cell number (PII) — null when user signed up by email"
      - name: tcpa_consent
        description: "User agreed to be contacted about their results"
      - name: send_offers
        description: "User opted in to offers"
      - name: send_updates
        description: "User opted in to updates"
