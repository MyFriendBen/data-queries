version: 2

sources:
  - name: django_apps
    description: "Raw Django application tables"
    schema: public
    config:
      enabled: "{{ target.type == 'postgres' }}"
    tables:
      - name: screener_screen
        description: "Raw screener submissions from Django Screen model"
        columns:
          - name: id
            description: "Primary key"
          - name: completed
            description: "Whether the screener was completed"
            tests:
              - not_null
          - name: submission_date
            description: "When the screener was submitted"
          - name: is_test
            description: "Whether this is test data"
          - name: created_at
            description: "When the record was created"
          - name: updated_at
            description: "When the record was last updated"
      - name: screener_whitelabel
        description: "White label organizations from Django WhiteLabel model"
        columns:
          - name: id
            description: "Primary key"
          - name: name
            description: "White label organization name"
          - name: code
            description: "White label organization code"
          - name: state_code
            description: "State code for the white label"
          - name: cms_method
            description: "CMS method used by the white label"
      - name: screener_eligibilitysnapshot
        description: "Eligibility snapshot records from Django EligibilitySnapshot model"
        columns:
          - name: id
            description: "Primary key"
          - name: screen_id
            description: "Foreign key to screener_screen"
          - name: submission_date
            description: "When the eligibility snapshot was created"
          - name: is_batch
            description: "Whether this is a batch snapshot"
          - name: had_error
            description: "Whether the snapshot had an error"
      - name: screener_programeligibilitysnapshot
        description: "Program eligibility snapshot records from Django ProgramEligibilitySnapshot model"
        columns:
          - name: id
            description: "Primary key"
          - name: eligibility_snapshot_id
            description: "Foreign key to screener_eligibilitysnapshot"
          - name: new
            description: "Whether this is a new eligibility result"
          - name: name
            description: "Full program name"
          - name: name_abbreviated
            description: "Abbreviated program name"
          - name: estimated_value
            description: "Estimated dollar value of benefit"
          - name: estimated_delivery_time
            description: "Estimated time to receive benefit"
          - name: estimated_application_time
            description: "Estimated time to apply for benefit"
          - name: eligible
            description: "Whether household is eligible for program"
          - name: failed_tests
            description: "JSON of failed eligibility tests"
          - name: passed_tests
            description: "JSON of passed eligibility tests"
      - name: translations_translation
        description: "Translation metadata table from Django"
        columns:
          - name: id
            description: "Primary key"
          - name: label
            description: "Translation label (e.g., program.%-name)"
      - name: translations_translation_translation
        description: "Translation text table from Django"
        columns:
          - name: id
            description: "Primary key"
          - name: master_id
            description: "Foreign key to translations_translation"
          - name: language_code
            description: "Language code for the translation (e.g., en-us)"
          - name: text
            description: "Translation text"
      - name: programs_program
        description: "Programs table from Django that links programs to white labels"
        columns:
          - name: id
            description: "Primary key"
          - name: name_abbreviated
            description: "Abbreviated program name (slug)"
          - name: name_id
            description: "Foreign key to translations_translation for the program display name"
          - name: category_id
            description: "Foreign key to programs_programcategory"
          - name: white_label_id
            description: "White label organization ID for RLS"
      - name: programs_programcategory
        description: "Program category definitions from Django ProgramCategory model"
        columns:
          - name: id
            description: "Primary key"
          - name: tax_category
            description: "True when all programs in this category are tax credits"
      - name: screener_current_benefits
        description: "Join table recording which programs a household currently receives at screen time"
        columns:
          - name: id
            description: "Primary key"
          - name: screen_id
            description: "Foreign key to screener_screen"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'screener_screen')
          - name: program_id
            description: "Foreign key to programs_program"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'programs_program')
      - name: screener_incomestream
        description: "Income stream records from Django IncomeStream model"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - not_null
              - unique
          - name: screen_id
            description: "Foreign key to screener_screen"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'screener_screen')
          - name: type
            description: "Type of income stream"
          - name: amount
            description: "Income amount"
            tests:
              - not_null
          - name: frequency
            description: "Income frequency"
      - name: screener_expense
        description: "Expense records from Django Expense model"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - not_null
              - unique
          - name: screen_id
            description: "Foreign key to screener_screen"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'screener_screen')
          - name: type
            description: "Type of expense"
          - name: amount
            description: "Expense amount"
            tests:
              - not_null
          - name: frequency
            description: "Expense frequency"
      - name: screener_householdmember
        description: "Household member records from Django HouseholdMember model"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - not_null
              - unique
          - name: screen_id
            description: "Foreign key to screener_screen"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'screener_screen')
          - name: age
            description: "Age of household member"
          - name: relationship
            description: "Relationship to head of household"
          - name: has_disability
            description: "Whether member has a disability"
      - name: programs_referrer
        description: "Referrer records from Django Referrer model. Each row stores a referrer_code and its display name inline, scoped to one white label."
        columns:
          - name: id
            description: "Primary key"
          - name: white_label_id
            description: "Foreign key to screener_whitelabel"
          - name: referrer_code
            description: "The referrer code used to identify partners"
          - name: name
            description: "Display name of the partner"
          - name: show_in_dropdown
            description: "Whether this referrer appears in the frontend dropdown"
          - name: is_partner
            description: "Whether this referrer is a named partner org (True) or a generic option like Friend/Google (False). Used to group options in the screener dropdown and filter the Metabase partner dashboard."
      - name: screener_energycalculatorscreen
        description: "Energy calculator screen records from Django EnergyCalculatorScreen model"
        columns:
          - name: id
            description: "Primary key"
            tests:
              - not_null
              - unique
          - name: screen_id
            description: "Foreign key to screener_screen"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('django_apps', 'screener_screen')
          - name: energy_cost
            description: "Monthly energy cost"
          - name: heating_fuel_type
            description: "Type of heating fuel used"
      # ORDERING: the tests on these two tables run against the PRODUCTION Django
      # database — dbt has no other target (DEPLOYMENT_PLAN.md; staging was removed in
      # MFB-962) and both workflows run a plain `dbt build`, which executes source
      # tests. So benefits-api's migrations 0162/0163 must have been applied to
      # production before this file references the tables, or every test node errors
      # with "relation does not exist", failing the job and skipping the Metabase sync
      # that follows it. Merging to main auto-deploys benefits-api STAGING only;
      # production needs a published GitHub Release.
      - name: screener_assistantconversation
        description: >
          One Benji conversation per row, with a snapshot of the screen context
          the model was given. Django owns this schema (screener/models.py) but
          mfb-ai-service is the runtime writer, so rows appear here without any Django
          request having happened.

          Joins to screener_screen on screen_uuid (NOT id) — Screen.uuid carries no
          unique constraint, so no foreign key was possible.
        columns:
          - name: conversation_id
            description: "Primary key (UUID), generated by mfb-ai-service"
            tests:
              - not_null
              - unique
          - name: screen_uuid
            description: "The screen this conversation is about. Join to screener_screen.uuid."
            tests:
              - not_null
              # The only referential link here with no database-level protection: no
              # foreign key was possible because Screen.uuid has no unique constraint
              # (see this table's description). mfb-ai-service writes this column from
              # the payload it is handed, so "the screen exists" is a convention upheld
              # in application code across a repository boundary rather than an enforced
              # constraint. An orphan would silently drop out of every join to
              # screener_screen and understate Benji usage with no error anywhere.
              # dbt's relationships test only checks existence, so the missing unique
              # constraint on the target is not an obstacle.
              - relationships:
                  arguments:
                    field: uuid
                    to: source('django_apps', 'screener_screen')
          - name: white_label
            description: "White label CODE ('co', 'tx'), not an id. Join to screener_whitelabel.code."
          - name: locale
            description: "Locale the conversation was opened in (e.g. 'en-US')"
          - name: mode
            description: "'live' (model-generated replies) or 'stub' (scripted). Changes how a transcript should be read."
          - name: prompt_version
            description: "System-prompt version in force at the last turn — the grouping key for prompt-change analysis"
          - name: status
            description: "'active' or 'closed'. At most one active conversation per screen (enforced by a partial unique index)."
          - name: context
            description: >
              jsonb snapshot of the household and program lists the prompt was built
              from: household.size, eligible_programs[], current_programs[],
              results_url. CONTAINS PII.
          - name: created_at
            description: "When the conversation was opened"
          - name: updated_at
            description: "Last activity — the newest-first sort key. Not the same as created_at: a conversation opened months ago and used yesterday is recent by this column and old by that one."
      - name: screener_assistantmessage
        description: >
          One turn per row. Assistant rows carry the reply metadata that makes Benji's
          cost and latency answerable per turn; user rows leave those NULL.
        tests:
          # `seq` is assigned as MAX(seq)+1 by mfb-ai-service under a row lock, with a
          # UNIQUE(conversation_id, seq) constraint as the backstop. If that constraint
          # were dropped, or a writer appeared that did not take the lock, two turns
          # would silently share a position — and since a reply is located as
          # `user.seq + 1` and transcripts are ordered by seq, the symptom is a
          # scrambled conversation rather than an error. This is the check against real
          # production data; nothing else here would notice.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - conversation_id
                  - seq
          # Mirrors the PARTIAL unique index on client_message_id. The `where` is not
          # optional: most turns carry no client id, and GROUP BY treats NULLs as equal,
          # so without the filter every conversation with two ordinary messages would
          # fail this test.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - conversation_id
                  - client_message_id
              config:
                where: "client_message_id is not null"
        columns:
          - name: message_id
            description: "Primary key (UUID)"
            tests:
              - not_null
              - unique
          - name: conversation_id
            description: "Foreign key to screener_assistantconversation"
            tests:
              - not_null
              - relationships:
                  arguments:
                    field: conversation_id
                    to: source('django_apps', 'screener_assistantconversation')
          - name: seq
            description: "Turn position within the conversation, from 0. THE ordering key — created_at is not safe for this, since a user message and its reply are written in one transaction and can share a timestamp."
            tests:
              - not_null
          - name: role
            description: "'user' or 'assistant'"
            tests:
              - not_null
          - name: text
            description: "Message body (Markdown for assistant turns). FREE TEXT FROM USERS — treat as PII."
          - name: client_message_id
            description: "Client idempotency key, when the frontend sent one. Unique within a conversation."
          - name: suggested_actions
            description: "jsonb array of action chips offered with an assistant reply"
          - name: model
            description: "Model that produced the reply (assistant rows only) — the cost-attribution key"
          - name: prompt_tokens
            description: "Prompt tokens billed for this reply (assistant rows only)"
          - name: completion_tokens
            description: "Completion tokens billed for this reply (assistant rows only)"
          - name: latency_ms
            description: "Upstream model latency for this reply (assistant rows only)"
          - name: error
            description: "Upstream error recorded against this turn, when there was one"
          - name: created_at
            description: "When the turn was stored"
